name: infra-deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/deploy-infra.sh'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:

# Block concurrent runs against the same app to avoid GET-mutate-PUT races
# between infra and app pipelines.
concurrency:
  group: aca-${{ vars.APP_NAME || 'api' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.RG }}
      APP: ${{ vars.APP_NAME || 'api' }}
      LOCATION: ${{ vars.LOCATION || 'eastus2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infra (preserves current image)
        run: bash scripts/deploy-infra.sh
